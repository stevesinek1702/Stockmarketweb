<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đổi mật khẩu — VN Stock</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
</head>
<body class="auth-page">
    <div class="auth-card">
        <div class="auth-logo">
            <div class="logo-icon">🔑</div>
            <div class="logo-text" style="font-size:1.3rem;">Đổi mật khẩu</div>
        </div>

        <div class="auth-error" id="errorBox"></div>
        <div class="auth-success" id="successBox"></div>

        <form class="auth-form" id="pwForm">
            <div>
                <label for="current">Mật khẩu hiện tại</label>
                <input type="password" id="current" autocomplete="current-password" required autofocus>
            </div>
            <div>
                <label for="newpass">Mật khẩu mới (tối thiểu 6 ký tự)</label>
                <input type="password" id="newpass" autocomplete="new-password" required minlength="6">
            </div>
            <div>
                <label for="confirm">Nhập lại mật khẩu mới</label>
                <input type="password" id="confirm" autocomplete="new-password" required minlength="6">
            </div>
            <button type="submit" class="auth-btn" id="submitBtn">Đổi mật khẩu</button>
        </form>

        <div class="auth-link">
            <a href="/">← Về Dashboard</a>
        </div>
    </div>

    <script src="js/auth.js"></script>
    <script>
        // Gating — phải login
        (async () => {
            const u = await VNAuth.currentUser();
            if (!u) window.location.href = '/login.html';
        })();

        document.getElementById('pwForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const errBox = document.getElementById('errorBox');
            const okBox = document.getElementById('successBox');
            const btn = document.getElementById('submitBtn');
            errBox.classList.remove('show');
            okBox.classList.remove('show');

            const currentPassword = document.getElementById('current').value;
            const newPassword = document.getElementById('newpass').value;
            const confirm = document.getElementById('confirm').value;

            if (newPassword !== confirm) {
                errBox.textContent = 'Mật khẩu mới nhập lại không khớp';
                errBox.classList.add('show');
                return;
            }
            if (newPassword.length < 6) {
                errBox.textContent = 'Mật khẩu mới tối thiểu 6 ký tự';
                errBox.classList.add('show');
                return;
            }

            btn.disabled = true;
            btn.textContent = 'Đang xử lý...';
            try {
                const res = await fetch('/api/user/password', {
                    method: 'POST',
                    credentials: 'same-origin',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ currentPassword, newPassword })
                });
                const json = await res.json();
                if (!json.success) throw new Error(json.error);
                okBox.textContent = '✅ ' + json.message;
                okBox.classList.add('show');
                document.getElementById('pwForm').reset();
            } catch (err) {
                errBox.textContent = err.message;
                errBox.classList.add('show');
            }
            btn.disabled = false;
            btn.textContent = 'Đổi mật khẩu';
        });
    </script>
</body>
</html>

version: '3.8'

services:
  # ── Database (Postgres) ──────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: vnstock-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vnstock}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vnstock_dev}
      POSTGRES_DB: ${POSTGRES_DB:-vnstock}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vnstock}"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ── Cache (Redis) ────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: vnstock-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ── App (Express + PM2 cluster) ──────────────────────────
  express:
    build: .
    container_name: vnstock-express
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgres://${POSTGRES_USER:-vnstock}:${POSTGRES_PASSWORD:-vnstock_dev}@postgres:5432/${POSTGRES_DB:-vnstock}
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET required in .env}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD required in .env}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      FIREANT_EMAIL: ${FIREANT_EMAIL:-}
      FIREANT_PASSWORD: ${FIREANT_PASSWORD:-}
      APPS_SCRIPT_URL: ${APPS_SCRIPT_URL:-}
      COOKIE_TTL_HOURS: ${COOKIE_TTL_HOURS:-6}
      COOKIE_SYNC_HOURS: ${COOKIE_SYNC_HOURS:-5}
      GSHEET_SYNC_URL: ${GSHEET_SYNC_URL:-}
      GSHEET_SYNC_TOKEN: ${GSHEET_SYNC_TOKEN:-}
    # KHÔNG expose port ra host — nginx sẽ reverse proxy
    expose:
      - "3000"
    volumes:
      # Mount data dir để filter-presets.json (legacy) + logs persist
      - expressdata:/app/server/data

  # ── Reverse proxy (Nginx) ────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: vnstock-nginx
    restart: unless-stopped
    depends_on:
      - express
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    # Cert (Let's Encrypt) mount bên ngoài — tạo bằng certbot riêng

volumes:
  pgdata:
  redisdata:
  expressdata:

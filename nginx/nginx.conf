worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Logging
    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log warn;

    sendfile        on;
    keepalive_timeout 65;
    client_max_body_size 10m;

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml;
    gzip_min_length 1024;

    # Rate limiting: 30 req/phút per IP cho API (chống abuse khi public)
    limit_req_zone $binary_remote_addr zone=api:10m rate=30r/m;

    upstream express_backend {
        server express:3000;
        keepalive 32;
    }

    server {
        listen 80;
        # listen 443 ssl;  ← bật khi có cert TLS
        # ssl_certificate     /etc/nginx/certs/fullchain.pem;
        # ssl_certificate_key /etc/nginx/certs/privkey.pem;
        server_name _;

        # Static files (frontend) — serve trực tiếp, nhanh hơn qua Node
        location / {
            proxy_pass http://express_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # API endpoints
        location /api/ {
            limit_req zone=api burst=60 nodelay;
            proxy_pass http://express_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 60s;
        }

        # Login/register/admin — KHÔNG rate limit khắt khe (tránh block user hợp lệ)
        location ~ ^/(login|register|admin|portfolio)\.html$ {
            proxy_pass http://express_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Health check (cho Docker / monitoring)
        location /api/health {
            access_log off;
            proxy_pass http://express_backend;
        }
    }
}
